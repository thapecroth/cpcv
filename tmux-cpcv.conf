# cpcv tmux compatibility bindings.
# For the plugin, source cpcv.tmux instead. This file expects the optional
# remote helper at ~/.local/bin/cpcv-latest.  Keep the portable default in the
# prefix table so terminal apps can retain their own Ctrl-V behavior.
# If this file is re-sourced after upgrading from the old root-table shortcut,
# remove only the exact legacy cpcv helper binding; leave any user C-v alone.
run-shell 'tmux list-keys -T root | grep -Eq "^bind-key[[:space:]]+-T[[:space:]]+root[[:space:]]+C-v[[:space:]].*cpcv-latest --pane" && tmux unbind-key -T root C-v || true'

run-shell 'binding="$(tmux list-keys -T prefix | grep -E "^bind-key[[:space:]]+-T[[:space:]]+prefix[[:space:]]+v[[:space:]]" || true)"; if [ -z "$binding" ] || printf "%s\n" "$binding" | grep -Fq "CPCV_TMUX_COMPAT=1"; then tmux bind-key -T prefix v run-shell -b "CPCV_TMUX_COMPAT=1 ~/.local/bin/cpcv-latest --pane \"##{pane_id}\""; else tmux display-message "cpcv: prefix/v is already bound; source cpcv.tmux to choose another key"; fi'
