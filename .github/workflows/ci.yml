name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-windows:
    name: Windows PowerShell
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check workflow security policy
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $violations = [System.Collections.Generic.List[string]]::new()
          $workflowFiles = Get-ChildItem -LiteralPath .github/workflows -Recurse -File -Include *.yml,*.yaml
          foreach ($workflow in $workflowFiles) {
            $lines = Get-Content -LiteralPath $workflow.FullName
            for ($index = 0; $index -lt $lines.Count; $index++) {
              $line = $lines[$index]
              if ($line -match '^\s*(?:-\s*)?uses:\s*(?<reference>\S+)') {
                $reference = $Matches.reference
                $isPinnedGitAction = $reference -match '@[0-9a-fA-F]{40}$'
                $isPinnedContainer = $reference -match '^docker://.+@sha256:[0-9a-fA-F]{64}$'
                $isLocalAction = $reference.StartsWith('./')
                if (-not ($isPinnedGitAction -or $isPinnedContainer -or $isLocalAction)) {
                  $violations.Add("$($workflow.FullName):$($index + 1): action reference '$reference' is not pinned to an immutable SHA.")
                }
              }
            }
            if ((Get-Content -Raw -LiteralPath $workflow.FullName) -match '(?m)^\s*pull_request_target\s*:') {
              $violations.Add("$($workflow.FullName): pull_request_target is not allowed; use pull_request with read-only permissions.")
            }
          }
          if ($violations.Count -gt 0) {
            $violations | ForEach-Object { Write-Error $_ }
            throw "Workflow security policy check failed."
          }
      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Disallow dynamic PowerShell evaluation
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $blockedCommands = @('invoke-expression', 'iex')
          $violations = [System.Collections.Generic.List[string]]::new()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            foreach ($command in $ast.FindAll({ param($node) $node -is [System.Management.Automation.Language.CommandAst] }, $true)) {
              $name = $command.GetCommandName()
              if ($name) {
                $shortName = ($name -split '\\')[-1].ToLowerInvariant()
                if ($blockedCommands -contains $shortName) {
                  $violations.Add("$($_.FullName):$($command.Extent.StartLineNumber): dynamic PowerShell evaluation via '$name' is not permitted.")
                }
              }
            }
          }
          if ($violations.Count -gt 0) {
            $violations | ForEach-Object { Write-Error $_ }
            throw "PowerShell security policy check failed."
          }
      - name: Run safe Windows tests
        shell: powershell
        run: |
          .\tests\test-process-timeout.ps1
          .\tests\test-windows-e2e.ps1
          .\tests\test-tray.ps1
          .\tests\test-installer-ownership.ps1

  test-macos:
    name: macOS native client
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run network-free native checks
        shell: bash
        run: bash macos/test-macos.sh
